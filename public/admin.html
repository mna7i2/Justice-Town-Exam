<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Justice Town | لوحة النتائج</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#03050b">
  <link rel="icon" href="/assets/logo-circle.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="/">
      <img src="/assets/logo.webp" alt="" width="34" height="34">
      <span class="brand-text">JUSTICE<b>TOWN</b></span>
    </a>
    <div class="topbar-end">
      <a class="admin-link" href="/">صفحة الاختبار</a>
      <div class="user-chip" id="admin-chip" hidden>
        <span>🛡 <b id="admin-who"></b></span>
        <button class="icon-btn" id="admin-logout" title="تسجيل الخروج" aria-label="تسجيل الخروج">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="admin">
    <div class="admin-head">
      <div>
        <p class="eyebrow"><span class="pulse"></span> لوحة الإدارة</p>
        <h1>نتائج اختبار التفعيل</h1>
      </div>
      <button class="btn btn-ghost" id="reload">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg> تحديث
      </button>
    </div>

    <div class="glass panel admin-login" id="login" hidden>
      <h3>دخول الإدارة</h3>
      <p id="login-text"></p>
      <form id="login-form" autocomplete="on">
        <label for="admin-name">اسمك</label>
        <input id="admin-name" maxlength="32" autocomplete="nickname" required>
        <label for="admin-discord-id">آيديك في الدسكورد <small class="muted">(عشان ينمنشن اسمك في الروم)</small></label>
        <input id="admin-discord-id" dir="ltr" inputmode="numeric" maxlength="20" placeholder="123456789012345678" required>
        <p class="id-help">Discord ← الإعدادات ← Advanced ← فعّل <b>Developer Mode</b>، بعدها اضغط على اسمك يمين ← <b>Copy User ID</b></p>
        <p class="login-error" id="login-error" hidden></p>
        <button class="btn btn-primary" type="submit">دخول</button>
      </form>
      <a class="btn btn-primary discord-login" id="discord-login" href="/auth/discord?next=admin" hidden>دخول بحساب Discord</a>
      <p class="login-error" id="discord-error" hidden></p>
    </div>

    <div id="content" hidden>
      <div class="stats admin-stats" id="stats"></div>

      <div class="admin-grid">
        <div class="glass list-panel">
          <div class="toolbar">
            <div class="seg" id="filter">
              <button class="is-on" data-f="all">الكل</button>
              <button data-f="pass">ناجح</button>
              <button data-f="fail">راسب</button>
              <button data-f="pending">بانتظار الرتبة</button>
            </div>
            <input class="search" id="search" type="search" placeholder="ابحث باليوزر أو اسم الإداري…" autocomplete="off">
          </div>
          <div class="rows" id="rows"></div>
        </div>

        <div class="side">
          <aside class="glass hardest">
            <h3>سجل الإدارة</h3>
            <p class="muted">مين فعّل ومين رفض</p>
            <div id="admin-log"></div>
          </aside>
          <aside class="glass hardest">
            <h3>أصعب الأسئلة</h3>
            <p class="muted">نسبة اللي جاوبوا صح</p>
            <div id="hardest"></div>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <!-- Attempt drawer -->
  <div class="modal" id="drawer" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="glass drawer-card" role="dialog" aria-modal="true">
      <button class="icon-btn drawer-x" data-close aria-label="إغلاق">✕</button>
      <div id="drawer-body"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/effects.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
